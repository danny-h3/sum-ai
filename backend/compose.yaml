services:
  postgres:
    image: postgres:latest
    container_name: pkb_psql_container
    ports:
     - "5432:5432"
    environment:
  
  redis:
    image: redis:8.8-m03-trixie
    container_name: pkb_redis_container
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server 
    container_name: pkb_llm_container
    platform: linux/amd64
    ports:
      - "8000:8000"
    volumes:
      - ./ai-models/Qwen3.5-4B-Q4_K_M.gguf:/models/Qwen3.5-4B-Q4_K_M.gguf
      # - ./Qwen2.5-3b-Q4_K_M.gguf:/models/Qwen2.5-3b-Q4_K_M.gguf
    command: > 
      --model /models/Qwen3.5-4B-Q4_K_M.gguf
      --port 8000
      --host 0.0.0.0
      --ctx-size 8192
    
  embeddings:
    image: [FILL_IN]
    container_name: pkb_embeddings_container
    platform: linux/amd64
    ports:
      - "8001:8001"
    
  minio:
    image: minio/minio:latest
    container_name: pkb_minio_container
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: supersecretpassword
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"

volumes:
  redis-data:
  minio-data:
