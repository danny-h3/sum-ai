services:
  llm: 
    image: ghcr.io/ggml-org/llama.cpp:server 
    platform: linux/amd64
    ports:
      - "8000:8000"
    volumes:
      - ./qwen2.5-3b-instruct-q4_k_m.gguf:/models/qwen2.5-3b-instruct-q4_k_m.gguf
    command: > 
      --model /models/qwen2.5-3b-instruct-q4_k_m.gguf
      --port 8000
      --host 0.0.0.0
      --ctx-size 4096
    